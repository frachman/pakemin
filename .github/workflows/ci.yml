name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test and validate on Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - "18"
          - "20"
          - "22"
          - "24"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run tests
        run: npm test

      - name: Validate documentation
        run: npm run validate

      - name: Validate reference repository
        run: node ./bin/pakemin.js validate examples/saas-reference-repository --adapters

  required-check:
    name: Test and validate
    runs-on: ubuntu-latest
    needs: test
    if: always()

    steps:
      - name: Check matrix result
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Node.js matrix failed"
            exit 1
          fi
          echo "Node.js matrix passed"
